model_list:
  # =========================================================================
  # 1. Основная актуальная модель (Gemini 3.5 Flash) с пулом ротации ключей
  # =========================================================================
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15
  # Резервные ключи для пула ротации (раскомментировать при наличии активных ключей):
  # - model_name: gemini-3.5-flash
  #   litellm_params:
  #     model: gemini/gemini-3.5-flash
  #     api_key: os.environ/GEMINI_API_KEY_2
  #     rpm: 15

  # =========================================================================
  # 2. Облегченная модель (Gemini 3.5 Flash Lite) — 1-й уровень Fallback
  # =========================================================================
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30

  # =========================================================================
  # 3. Стабильная проверенная модель (Gemini 2.5 Flash) — 2-й уровень Fallback
  # =========================================================================
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

# ===========================================================================
# Умный роутинг, автоматический Cooldown и каскадные Fallback
# ===========================================================================
router_settings:
  routing_strategy: "simple-shuffle"     # Ротация и балансировка по пулу доступных ключей
  num_retries: 3                         # Автоповтор до 3 раз при ошибках 429/5xx
  timeout: 30                            # Таймаут запроса в секундах
  retry_after: 2                         # Интервал между ретраями
  allowed_fails: 1                       # При 1 сбое ключ временно отправляется в кулдаун
  cooldown_time: 60                      # Изоляция сбойного ключа на 60 секунд
  fallbacks:
    - gemini-3.5-flash: ["gemini-3.5-flash-lite", "gemini-2.5-flash"]
    - gemini-3.5-flash-lite: ["gemini-2.5-flash"]

general_settings:
  master_key: os.environ/LITELLM_API_KEY

model_list:
  # Основная актуальная модель (Gemini 3.5 Flash)
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  # Облегченная сверхбыстрая модель (Gemini 3.5 Flash Lite)
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  # Проверенная стабильная модель (Gemini 2.5 Flash)
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  # Актуальная модель векторных эмбеддингов (3072 dim)
  - model_name: gemini-embedding-2
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 3
  timeout: 30
  retry_after: 5
  allowed_fails: 2

general_settings:
  master_key: os.environ/LITELLM_API_KEY

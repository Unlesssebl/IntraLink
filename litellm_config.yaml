model_list:
  # =========================================================================
  # 1. Облачный пул Google Gemini (с каскадной ротацией)
  # =========================================================================
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: gemini/gemini-2.0-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30

  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  - model_name: gemini-1.5-flash-8b
    litellm_params:
      model: gemini/gemini-1.5-flash-8b
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30

  # =========================================================================
  # 2. Внешние высокоскоростные провайдеры (Groq / OpenRouter)
  # =========================================================================
  - model_name: groq-llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  # =========================================================================
  # 3. Локальная Ollama (безотказный финальный Fallback на хосте)
  # =========================================================================
  - model_name: ollama-qwen
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://host.docker.internal:11434

  # =========================================================================
  # 4. Локальные эмбеддинги BGE-M3 (1024 dim)
  # =========================================================================
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434

  # Алиасы старых имен моделей на локальный bge-m3 для обратной совместимости
  - model_name: gemini-embedding-001
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434

  - model_name: gemini-embedding-2
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434

# ===========================================================================
# Умный роутинг, автоматический Cooldown и каскадные Fallback
# ===========================================================================
router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 3
  timeout: 30
  retry_after: 2
  allowed_fails: 3
  cooldown_time: 15
  fallbacks:
    - gemini-3.5-flash: ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash", "groq-llama-3.3-70b", "ollama-qwen"]
    - gemini-2.5-flash: ["gemini-2.0-flash", "gemini-1.5-flash", "groq-llama-3.3-70b", "ollama-qwen"]
    - gemini-2.0-flash: ["gemini-1.5-flash", "gemini-1.5-flash-8b", "ollama-qwen"]
    - gemini-1.5-flash: ["gemini-1.5-flash-8b", "ollama-qwen"]
    - gemini-embedding-2: ["gemini-embedding-001", "bge-m3"]
    - gemini-embedding-001: ["bge-m3"]

general_settings:
  master_key: os.environ/LITELLM_API_KEY
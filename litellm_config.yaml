model_list:
  # Один стабильный публичный alias для текста. Провайдеры меняются здесь,
  # а Core API и клиенты всегда используют intralink-chat.
  - model_name: intralink-chat
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

  # Локальный резерв; RED-контур обращается к Ollama напрямую.
  - model_name: intralink-local
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://host.docker.internal:11434

  # Единственный профиль эмбеддингов: BGE-M3, 1024 измерения.
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 30
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - intralink-chat: [intralink-local]

general_settings:
  master_key: os.environ/LITELLM_API_KEY

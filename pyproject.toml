[project]
name = "intralink"
version = "0.2.0"
description = "IntraLink v2 - Vertical Slice Architecture & LiteLLM Gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "intralink-core",
    "intralink-api",
    "intralink-worker",
]

[tool.uv.workspace]
members = ["core", "api", "worker"]

[tool.uv.sources]
intralink-core = { workspace = true }
intralink-api = { workspace = true }
intralink-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.138.0",
    "ruff>=0.9.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["core/tests", "api/tests", "worker/tests"]
pythonpath = [".", "core", "api", "worker"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "core", "api", "worker"]
exclude = ["**/__pyrefly_virtual__", "node_modules", "intra-web", "web"]

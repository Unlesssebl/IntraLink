[project]
name = "intraservice-tg-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.0.0",
    "aiohttp>=3.13.5",
    "apscheduler>=3.11.2",
    "python-dotenv>=1.2.2",
    "redis>=5.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "pywinrm>=0.4.3",
    "smbprotocol>=1.12.0",
    "impacket>=0.12.0",
]

[tool.pyright]
extraPaths = ["bot", "core-api", "printer-worker"]
exclude = ["**/__pyrefly_virtual__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core-api/tests"]
pythonpath = ["core-api"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pyrefly]
project-excludes = [
    "**/__pyrefly_virtual__/**",
]



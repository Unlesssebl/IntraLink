[project]
name = "intralink-worker"
version = "0.2.0"
description = "IntraLink Background Automation Worker"
requires-python = ">=3.13"
dependencies = [
    "intralink-core",
    "redis>=5.0.0",
    "pywinrm>=0.4.3",
    "smbprotocol>=1.12.0",
    "impacket>=0.12.0",
    "ldap3>=2.9.1",
]

[tool.uv.sources]
intralink-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ==============================================================================
# IntraLink — Docker Compose Оверлей для NVIDIA GPU (CUDA / RTX 3050)
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
# Или через .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml
# ==============================================================================
services:
  ollama:
    environment:
      # По умолчанию 1 для RTX 3050 (если GPU 0 — интерфейсная GTX 1650)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-1}
      - NVIDIA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-1}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  core-api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  poller:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

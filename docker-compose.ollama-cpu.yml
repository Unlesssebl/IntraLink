# ==============================================================================
# IntraLink — Docker Compose Оверлей для запуска Ollama в Docker (CPU)
# Используется, если на хосте нет установленной Ollama.
#
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
# Или через .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ollama.yml
# ==============================================================================
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: intralink_ollama
    restart: always
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_FLASH_ATTENTION=1

  core-api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  poller:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:

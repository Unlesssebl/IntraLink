[project]
name = "intralink-core"
version = "0.2.0"
description = "IntraLink Core Domain Logic"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intraservice", "rag", "diagnostic", "database", "autopilot", "triage"]

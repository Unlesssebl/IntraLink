# ==============================================================================
# IntraLink — Docker Compose Оверлей для AMD GPU (Vulkan / Direct Rendering)
# Работает напрямую через графический стек Vulkan без тяжелого ROCm.
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.vulkan.yml up -d
# Или через .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vulkan.yml
# ==============================================================================
services:
  ollama:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}

  core-api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  poller:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

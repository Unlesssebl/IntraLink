<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntraLink Desktop Companion</title><style>body{font-family:Segoe UI,sans-serif;background:#f8fafc;color:#18181b;margin:0;padding:28px}h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:#52525b;margin:0 0 22px}.field{margin:14px 0}label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #d4d4d8;border-radius:7px}button{margin-top:12px;background:#18181b;color:#fff;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}#status{font-size:12px;margin-left:8px;color:#52525b}</style></head><body><h1>Desktop Companion</h1><p>Укажите URL Core API и локальные пути к утверждённым клиентам. Пароли здесь не хранятся.</p><div class="field"><label>Core API URL</label><input id="core_api_url" placeholder="https://intralink.company.local"></div><div class="field"><label>LiteManager (romviewer.exe)</label><input id="litemanager_path"></div><div class="field"><label>DameWare (dwrcc.exe)</label><input id="dameware_path"></div><div class="field"><label>RDP (mstsc.exe)</label><input id="rdp_path"></div><button id="save">Сохранить</button><span id="status"></span><script src="settings.js"></script></body></html>

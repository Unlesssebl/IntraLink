# ==============================================================================
# IntraLink — Docker Compose Оверлей для AMD GPU (Vulkan / Direct Rendering)
# Работает напрямую через графический стек Vulkan без тяжелого ROCm.
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.ollama-vulkan.yml up -d
# Или через .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ollama-vulkan.yml
# ==============================================================================
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: intralink_ollama
    restart: always
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_FLASH_ATTENTION=1

  core-api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  poller:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:

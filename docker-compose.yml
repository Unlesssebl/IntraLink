name: intralink

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intralink_postgres
    restart: always
    environment:
      - POSTGRES_DB=intraservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intraservice"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: intralink_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: intralink_litellm
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_API_KEY=${LITELLM_API_KEY:-dev-only-litellm-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--host"
      - "0.0.0.0"

  db-migrate:
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: alembic -c alembic.ini upgrade head
    restart: "no"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - encryption_key
      - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: intralink_core_api
    restart: always
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - ./docs/presentations:/app/docs/presentations:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - REDIS_URL=redis://redis:6379/0
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - OLLAMA_BASE_URL=${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PRINTERS_KB_PATH=/app/knowledge_base/printers_knowledge_base.json
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - encryption_key
      - service_password
      - jwt_secret
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      litellm:
        condition: service_started

  poller:
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: intralink_poller
    command: python -m app.poller
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - REDIS_URL=redis://redis:6379/0
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - OLLAMA_BASE_URL=${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PRINTERS_KB_PATH=/app/knowledge_base/printers_knowledge_base.json
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - encryption_key
      - service_password
      - jwt_secret
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  command-worker:
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: intralink_command_worker
    command: python -m app.command_worker
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - encryption_key
      - jwt_secret
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
      target: test
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://test-redis:6379/0"
      INTRASERVICE_URL: "http://intraservice.test/api/"
      ENCRYPTION_KEY: ""
      BOT_API_KEY: "test-api-key"
    entrypoint: ["/workspace/.venv/bin/python", "-m", "pytest"]
    command: ["tests", "-q"]
    depends_on:
      test-redis:
        condition: service_healthy

  test-redis:
    profiles:
      - test
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  telegram-bot:
    profiles:
      - with-bot
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: intralink_tg_bot
    restart: always
    env_file:
      - .env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_KEY_ID=${TELEGRAM_SERVICE_KEY_ID:-}
      - SERVICE_SECRET=${TELEGRAM_SERVICE_SECRET:-}
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - core-api
      - redis

volumes:
  postgres_data:
  redis_data:

secrets:
  encryption_key:
    file: ./.secrets/encryption_key.txt
  service_password:
    file: ./.secrets/service_password.txt
  jwt_secret:
    file: ./.secrets/jwt_secret.txt

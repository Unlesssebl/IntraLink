services:
  postgres:
    image: postgres:16-alpine
    container_name: intraservice_postgres
    restart: always
    environment:
      - POSTGRES_DB=intraservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: intraservice_core_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./core-api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
    depends_on:
      - postgres

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: intraservice_tg_bot
    restart: always
    env_file:
      - ./bot/.env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
    depends_on:
      - core-api

volumes:
  postgres_data:



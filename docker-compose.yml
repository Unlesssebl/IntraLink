services:
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: intraservice_core_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./core-api/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/core_api.db
    volumes:
      - ./core-api-data:/app/data

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: intraservice_tg_bot
    restart: always
    env_file:
      - ./bot/.env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
    depends_on:
      - core-api


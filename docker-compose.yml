name: intralink

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intralink_postgres
    restart: always
    environment:
      - POSTGRES_DB=intraservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: intralink_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: intralink_ollama
    restart: always
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  core-api:
    build:
      context: .
      dockerfile: ./core-api/Dockerfile
    container_name: intralink_core_api
    restart: always
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    volumes:
      - ./docs/presentations:/app/docs/presentations:ro
    env_file:
      - ./core-api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - REDIS_URL=redis://redis:6379/0
      - PRINTERS_KB_PATH=/app/knowledge_base/printers_knowledge_base.json
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - INTRASERVICE_SERVICE_LOGIN=intratest
      - INTRASERVICE_SERVICE_USER_ID=9891
      - INTRASERVICE_SERVICE_PASSWORD_FILE=/run/secrets/service_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - encryption_key
      - service_password
      - jwt_secret
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - postgres
      - redis

  telegram-bot:
    profiles:
      - with-bot
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: intralink_tg_bot
    restart: always
    env_file:
      - ./telegram-bot/.env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - core-api
      - redis

volumes:
  postgres_data:
  redis_data:
  ollama_data:

secrets:
  encryption_key:
    file: ./.secrets/encryption_key.txt
  service_password:
    file: ./.secrets/service_password.txt
  jwt_secret:
    file: ./.secrets/jwt_secret.txt

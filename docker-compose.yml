services:
  postgres:
    image: postgres:16-alpine
    container_name: intraservice_postgres
    restart: always
    environment:
      - POSTGRES_DB=intraservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: intraservice_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: intraservice_core_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./core-api/.env
    volumes:
      - ./printer-worker/knowledge_base:/app/knowledge_base:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/intraservice
      - REDIS_URL=redis://redis:6379/0
      - PRINTERS_KB_PATH=/app/knowledge_base/printers_knowledge_base.json
      # Ключ шифрования. Сгенерируйте командой:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - ENCRYPTION_KEY=

    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - postgres
      - redis

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: intraservice_tg_bot
    restart: always
    env_file:
      - ./bot/.env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - core-api
      - redis

  printer-worker:
    build:
      context: ./printer-worker
      dockerfile: Dockerfile
    container_name: intraservice_printer_worker
    restart: always
    env_file:
      - ./printer-worker/.env
    environment:
      - CORE_API_URL=http://core-api:8000/api/v1
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 10.244.0.11
      - 172.18.128.50
      - 8.8.8.8
    dns_opt:
      - timeout:1
      - attempts:1
    dns_search:
      - corporate.loc
    depends_on:
      - core-api
      - redis

volumes:
  postgres_data:
  redis_data:




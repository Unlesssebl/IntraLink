[project]
name = "intralink-api"
version = "0.2.0"
description = "IntraLink API Service (Vertical Slice Architecture)"
requires-python = ">=3.13"
dependencies = [
    "intralink-core",
    "intralink-worker",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "openai>=1.30.0",
    "orjson>=3.10.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv.sources]
intralink-core = { workspace = true }
intralink-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
